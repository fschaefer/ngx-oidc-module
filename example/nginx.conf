load_module modules/ngx_http_oidc_module.so;

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    resolver 8.8.8.8 ipv4=on valid=300s;

    # --- OIDC provider configuration ---
    # Replace with your IdP values.
    oidc_provider my_idp {
        issuer        https://your-idp.example.com/realms/main;
        client_id     your-client-id;
        client_secret your-client-secret;
        session_encryption_key session-key-from-secret-store;
        # session_store sqlite:/var/lib/nginx/oidc/sessions.db;

        ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        # optional overrides:
        # config_url   https://your-idp.example.com/realms/main/.well-known/openid-configuration;
        # scopes       openid profile email;
        # redirect_uri /_oidc_callback;
        # logout_uri   /logout;
        # post_logout_uri https://demo.example.com/;
        # userinfo     on;
        # session_max_age 8h;  # capped by ID-token exp
        # session_cookie oidc_session_my_idp;  # required for multi-IdP
    }

    server {
        listen 80;
        server_name demo.example.com;

        location / {
            auth_oidc my_idp; # or: auth_oidc my_idp max_age=15m;

            # forward OIDC claims to the backend
            proxy_set_header sub   $oidc_claim_sub;
            proxy_set_header email $oidc_claim_email;
            proxy_set_header name  $oidc_claim_name;

            proxy_pass http://127.0.0.1:8080;
        }
    }

    # simple test backend
    server {
        listen 8080;

        location / {
            return 200 "Hello, $http_name!\nEmail: $http_email\nSub: $http_sub\n";
            default_type text/plain;
        }
    }
}
