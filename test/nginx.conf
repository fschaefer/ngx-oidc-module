load_module modules/ngx_http_oidc_module.so;

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 ipv4=on valid=300s;

    oidc_provider my_idp {
        issuer        https://idp.test:8443;
        client_id     test-client;
        client_secret test-secret;
        session_encryption_key test-session-key;
        session_store sqlite:/tmp/oidc-sessions.db;

        ssl_trusted_certificate /certs/ca.crt;
        userinfo on;
        session_max_age 30m;
        session_cookie oidc_session_my_idp;
        logout_uri /logout;
        backchannel_logout_uri /_oidc_backchannel;
        post_logout_uri http://demo.example.com/;
    }

    oidc_provider secondary_idp {
        issuer        https://idp.test:8443;
        client_id     test-client;
        client_secret test-secret;
        session_encryption_key test-session-key;
        session_store sqlite:/tmp/oidc-sessions.db;

        ssl_trusted_certificate /certs/ca.crt;
        userinfo on;
        session_max_age 30m;
        session_cookie oidc_session_secondary_idp;
        redirect_uri /_oidc_secondary_callback;
    }

    server {
        listen 80;
        server_name demo.example.com;

        location = /_oidc_secondary_callback {
            auth_oidc secondary_idp;
            proxy_pass http://127.0.0.1:8080;
        }

        location /secondary {
            auth_oidc secondary_idp;

            proxy_set_header sub   $oidc_claim_sub;
            proxy_set_header email $oidc_claim_email;
            proxy_set_header name  $oidc_claim_name;
            proxy_set_header department $oidc_userinfo_department;

            proxy_pass http://127.0.0.1:8080;
        }

        location / {
            auth_oidc my_idp max_age=15m;

            proxy_set_header sub   $oidc_claim_sub;
            proxy_set_header email $oidc_claim_email;
            proxy_set_header name  $oidc_claim_name;
            proxy_set_header department $oidc_userinfo_department;

            proxy_pass http://127.0.0.1:8080;
        }
    }

    server {
        listen 8080;

        location / {
            return 200 "Hello, $http_name!\nEmail: $http_email\nSub: $http_sub\nDepartment: $http_department\n";
            default_type text/plain;
        }
    }
}
