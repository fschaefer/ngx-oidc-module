services:
  idp:
    build:
      context: .
      dockerfile: Dockerfile.idp
    networks:
      oidc:
        aliases:
          - idp.test
    # kein Port-Publish: der IdP wird nur aus dem Compose-Netz angesprochen
    # (idp.test:8443), so kollidiert der Harness nicht mit anderen Diensten.

  nginx:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - ./nginx.conf:/usr/local/nginx/conf/nginx.conf:ro
      - ./certs:/certs:ro
    ports:
      - "8081:80"
    depends_on:
      - idp
    networks:
      - oidc

networks:
  oidc:
