load_module modules/ngx_http_oidc_module.so;

worker_processes 1;
error_log /dev/stderr info;
error_log /dev/stderr info;
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 ipv4=on valid=300s;

    oidc_provider keycloak {
        issuer https://keycloak.test:8443/realms/oidc-test;
        client_id nginx-oidc;
        client_secret nginx-oidc-secret;
        session_encryption_key test-session-key;
        session_store sqlite:/tmp/oidc-sessions.db;
        ssl_trusted_certificate /certs/ca.crt;
        scopes "openid profile email";
        userinfo on;
        session_max_age 30m;
        session_cookie oidc_keycloak_session;
        logout_uri /logout;
        post_logout_uri http://app.test/;
    }

    server {
        listen 80;
        server_name app.test;

        location / {
            auth_oidc keycloak;
            proxy_set_header X-OIDC-Name $oidc_claim_name;
            proxy_set_header X-OIDC-Email $oidc_claim_email;
            proxy_set_header X-OIDC-Sub $oidc_claim_sub;
            proxy_pass http://app:8000;
        }
    }
}
